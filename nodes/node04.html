<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Hex Whisper</title>

  <link rel="stylesheet" href="../styles/global.css">
</head>

<body>

  <div class="node-container">

    <h1>NODE 04 — HEX WHISPER</h1>

    <div class="story-section">
      <p>
        A dying operative left one final transmission — a hex string burned into a matchbox
        Decode it. Submit the word.
      </p>
    </div>

    <div class="challenge-section">
      <p>
        48 41 43 4B 45 44
      </p>
    </div>

    <div class="hint-section">
      <p>
        Each hex pair maps to one ASCII character. 48 in hex = 72 in decimal = 'H'.
      </p>
    </div>

    <div class="flag-section">
      <input type="text" id="flagInput" placeholder="ENTER FRAGMENT">

      <button onclick="validateFlag('node01')">
        RECOVER FRAGMENT
      </button>
    </div>

  </div>

  <script src="../scripts/main.js"></script>

</body>
</html>
